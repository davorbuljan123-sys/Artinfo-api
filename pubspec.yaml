name: portal_news
description: "A new Flutter news application for artinfo.ba"
publish_to: "none" 

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Mreža, XML parsiranje i datumi
  http: ^1.2.0
  xml: ^6.5.0
  intl: ^0.20.2
  
  # UI paketi koje aplikacija koristi u dizajnu stranica
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  shimmer: ^3.0.0
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
