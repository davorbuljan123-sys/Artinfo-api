name: portal_news
description: "A new Flutter news application for artinfo.ba"
publish_to: "none" 

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Osnovni paketi za rad s mrežom, XML-om i datumima
  http: ^1.2.0
  xml: ^6.5.0
  intl: ^0.20.2
  
  # Standardne ikone (ostavi ako si ih koristio u projektu)
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Ovdje možeš dodati assets (slike, fontove) ako ih projekt koristi
  # assets:
  #   - assets/images/
