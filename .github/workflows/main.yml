name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod s GitHuba
        uses: actions/checkout@v4

      - name: Postavi Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Postavi Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Dohvati pakete (Pub get)
        run: flutter pub get

      - name: Izgradi Release APK
        run: flutter build apk --release

      - name: Prenesi APK kao artefakt
        uses: actions/upload-artifact@v4
        with:
          name: portal-news-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
