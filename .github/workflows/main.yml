name: Build Flutter APK

on:
  workflow_dispatch: # Ova linija omogućuje ručno pokretanje (Manual trigger)
  # push:
  #   branches: [ "main" ] # Ako želiš skroz ugasiti push, stavi # ispred push-a ili ga obriši
 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod s GitHuba
        uses: actions/checkout@v4

      - name: Postavi Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Postavi Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Dohvati pakete (Pub get)
        run: flutter pub get

      - name: Izgradi Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation


      - name: Prenesi APK kao artefakt
        uses: actions/upload-artifact@v4
        with:
          name: portal-news-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
